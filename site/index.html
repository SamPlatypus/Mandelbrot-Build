<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070709" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mandelbrot" />
    <title>Mandelbrot</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070709;
        --ink: #f4f4f5;
        --muted: #a1a1aa;
        --line: rgba(255, 255, 255, 0.16);
        --panel: rgba(12, 12, 16, 0.88);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .dock {
        position: fixed;
        left: 50%;
        bottom: calc(14px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: min(392px, calc(100vw - 20px));
        pointer-events: none;
      }
      #install {
        pointer-events: auto;
        border: 0;
        border-radius: 999px;
        background: #f4f4f5;
        color: #111;
        min-height: 40px;
        padding: 0 16px;
        font-weight: 650;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #install[hidden] { display: none; }
      .dots {
        width: 64px;
        height: 36px;
        border: 0;
        border-radius: 999px;
        background: rgba(8, 8, 10, 0.55);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #fff;
        display: block;
      }
      .panel {
        width: 100%;
        max-height: min(70vh, 520px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 14px 12px;
        backdrop-filter: blur(16px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      .panel[hidden] { display: none; }
      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      h1 { font-size: 15px; font-weight: 650; letter-spacing: 0.01em; margin: 0; }
      .mag { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .presets {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        margin-bottom: 12px;
      }
      .presets button, .row button {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
        min-height: 34px;
        padding: 0 8px;
      }
      .presets button[aria-pressed="true"] {
        background: #f4f4f5;
        color: #111;
        border-color: transparent;
      }
      label.slider {
        display: grid;
        grid-template-columns: 92px 1fr 42px;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin: 8px 0;
      }
      label.slider span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
      input[type="range"] { width: 100%; accent-color: #f4f4f5; }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      .row button { flex: 1; }
      .hint { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.35; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="c"></canvas></div>
    <div class="dock">
      <button type="button" id="install" hidden>Add to home screen</button>
      <section class="panel" id="panel" hidden>
        <div class="head">
          <h1>Mandelbrot</h1>
          <div class="mag" id="mag">1×</div>
        </div>
        <div class="presets" id="presets"></div>
        <label class="slider">Iterations <input id="iter" type="range" min="32" max="1600" step="16" value="256" /> <span id="iterOut">256</span></label>
        <label class="slider">Bands <input id="bands" type="range" min="1" max="30" step="1" value="14" /> <span id="bandsOut">14</span></label>
        <label class="slider">Hue <input id="shift" type="range" min="0" max="360" step="1" value="0" /> <span id="shiftOut">0°</span></label>
        <div class="row">
          <button type="button" id="zin">Zoom in</button>
          <button type="button" id="zout">Zoom out</button>
          <button type="button" id="reset">Reset</button>
        </div>
        <p class="hint">Drag to pan. Tap to zoom in. Pinch or Shift-tap to zoom out. In Chrome, open the browser menu and choose Install app.</p>
      </section>
      <button class="dots" id="dots" type="button" aria-label="Open controls" aria-expanded="false">
        <i></i><i></i><i></i>
      </button>
    </div>
    <script>
      const PRESETS = [
        { id: "overview", name: "Overview", cx: -0.7, cy: 0, scale: 1.25, iter: 256, bands: 14 },
        { id: "seahorse", name: "Seahorse", cx: -0.743643887037151, cy: 0.13182590420533, scale: 0.00042, iter: 720, bands: 2 },
        { id: "elephant", name: "Elephant", cx: 0.281717921930775, cy: 0.577591832272226, scale: 0.018, iter: 480, bands: 3 },
        { id: "spiral", name: "Spiral", cx: -0.77568377, cy: 0.13646737, scale: 0.0034, iter: 560, bands: 3 },
        { id: "star", name: "Star", cx: -0.235125, cy: 0.827215, scale: 0.028, iter: 400, bands: 4 },
        { id: "filament", name: "Filament", cx: -0.088, cy: 0.654, scale: 0.011, iter: 480, bands: 3 },
      ];
      const canvas = document.getElementById("c");
      const panel = document.getElementById("panel");
      const dots = document.getElementById("dots");
      const magEl = document.getElementById("mag");
      const iterEl = document.getElementById("iter");
      const bandsEl = document.getElementById("bands");
      const shiftEl = document.getElementById("shift");
      const presetsEl = document.getElementById("presets");
      const state = {
        cx: PRESETS[0].cx,
        cy: PRESETS[0].cy,
        scale: PRESETS[0].scale,
        iter: 256,
        bands: 14,
        shift: 0,
        preset: "overview",
      };
      try {
        const saved = JSON.parse(localStorage.getItem("mandelbrot.pages.v1") || "null");
        if (saved && Number.isFinite(saved.cx)) Object.assign(state, saved);
      } catch (_) {}

      function fitScale() {
        const aspect = Math.max(0.2, canvas.clientWidth / Math.max(1, canvas.clientHeight));
        return Math.max(1.25, 1.675 / aspect);
      }
      function clampScale(s) { return Math.min(8, Math.max(1e-14, s)); }
      function worldPerPx() { return (2 * state.scale) / Math.max(1, canvas.clientHeight); }
      function save() {
        try { localStorage.setItem("mandelbrot.pages.v1", JSON.stringify(state)); } catch (_) {}
      }
      function magLabel() {
        const fit = fitScale();
        const m = fit / state.scale;
        magEl.textContent = (m >= 100 ? Math.round(m).toLocaleString() : m >= 10 ? m.toFixed(0) : m.toFixed(1)) + "×";
      }
      function syncControls() {
        iterEl.value = String(state.iter);
        bandsEl.value = String(state.bands);
        shiftEl.value = String(Math.round(state.shift * 360));
        document.getElementById("iterOut").textContent = String(state.iter);
        document.getElementById("bandsOut").textContent = String(state.bands);
        document.getElementById("shiftOut").textContent = shiftEl.value + "°";
        for (const b of presetsEl.querySelectorAll("button")) b.setAttribute("aria-pressed", b.dataset.id === state.preset ? "true" : "false");
        magLabel();
      }

      const gl = canvas.getContext("webgl2", { antialias: false, powerPreference: "high-performance" });
      let program = null;
      let uniforms = null;
      if (gl) {
        const vs = `#version 300 es
        void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position=vec4(p*2.0-1.0,0.0,1.0); }`;
        const fs = `#version 300 es
        precision highp float;
        uniform vec2 uRes;
        uniform vec2 uC;
        uniform float uScale;
        uniform float uIter;
        uniform float uDensity;
        uniform float uShift;
        out vec4 o;
        void main(){
          vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
          float cx = uC.x + uv.x * 2.0 * uScale;
          float cy = uC.y + uv.y * 2.0 * uScale;
          float q = cx - 0.25;
          float q2 = q*q + cy*cy;
          float xp = cx + 1.0;
          if (q2*(q2+q) < 0.25*cy*cy || xp*xp + cy*cy < 0.0625) { o = vec4(0.0); return; }
          float zx = 0.0, zy = 0.0, n = uIter;
          for (int i = 0; i < 1600; i++) {
            if (float(i) >= uIter) break;
            float x2 = zx*zx, y2 = zy*zy;
            if (x2 + y2 > 256.0) {
              float logZn = log(x2+y2)*0.5;
              float nu = log(logZn / log(2.0)) / log(2.0);
              n = float(i) + 1.0 - nu;
              break;
            }
            zy = 2.0*zx*zy + cy;
            zx = x2 - y2 + cx;
          }
          if (n >= uIter - 0.001) { o = vec4(0.0,0.0,0.0,1.0); return; }
          float hue = fract(uShift + n * uDensity);
          float glow = min(1.0, n / 2.2);
          vec3 rgb = clamp(abs(mod(hue*6.0 + vec3(0.0,4.0,2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0) * glow;
          o = vec4(rgb, 1.0);
        }`;
        function compile(type, src) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || "shader");
          return s;
        }
        program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program) || "link");
        uniforms = {
          uRes: gl.getUniformLocation(program, "uRes"),
          uC: gl.getUniformLocation(program, "uC"),
          uScale: gl.getUniformLocation(program, "uScale"),
          uIter: gl.getUniformLocation(program, "uIter"),
          uDensity: gl.getUniformLocation(program, "uDensity"),
          uShift: gl.getUniformLocation(program, "uShift"),
        };
      }

      function drawCPU() {
        const ctx = canvas.getContext("2d");
        const w = canvas.width, h = canvas.height;
        const img = ctx.createImageData(w, h);
        const d = img.data;
        const step = w * h > 400000 ? 2 : 1;
        const density = state.bands * 0.02;
        for (let y = 0; y < h; y += step) {
          const cy = state.cy + ((h - y) - h / 2) * (2 * state.scale) / h;
          for (let x = 0; x < w; x += step) {
            const cx = state.cx + (x - w / 2) * (2 * state.scale) / h;
            let n = state.iter;
            const q = cx - 0.25, q2 = q * q + cy * cy, xp = cx + 1;
            let inside = q2 * (q2 + q) < 0.25 * cy * cy || xp * xp + cy * cy < 0.0625;
            if (!inside) {
              let zx = 0, zy = 0;
              for (let i = 0; i < state.iter; i++) {
                const x2 = zx * zx, y2 = zy * zy;
                if (x2 + y2 > 256) {
                  const logZn = Math.log(x2 + y2) * 0.5;
                  n = i + 1 - Math.log(logZn / Math.LN2) / Math.LN2;
                  break;
                }
                zy = 2 * zx * zy + cy;
                zx = x2 - y2 + cx;
              }
            }
            let r = 0, g = 0, b = 0;
            if (n < state.iter - 1e-6) {
              let hue = (state.shift + n * density) % 1;
              if (hue < 0) hue += 1;
              const glow = Math.min(1, n / 2.2);
              const offs = [0, 4, 2];
              const ch = [];
              for (let k = 0; k < 3; k++) {
                const p = Math.abs(((hue * 6 + offs[k]) % 6) - 3) - 1;
                ch[k] = Math.round(Math.min(1, Math.max(0, p)) * glow * 255);
              }
              r = ch[0]; g = ch[1]; b = ch[2];
            }
            for (let yy = y; yy < Math.min(h, y + step); yy++) {
              for (let xx = x; xx < Math.min(w, x + step); xx++) {
                const o = (yy * w + xx) * 4;
                d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
              }
            }
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      function draw() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
        const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        if (gl && program) {
          gl.viewport(0, 0, w, h);
          gl.useProgram(program);
          gl.uniform2f(uniforms.uRes, w, h);
          gl.uniform2f(uniforms.uC, state.cx, state.cy);
          gl.uniform1f(uniforms.uScale, state.scale);
          gl.uniform1f(uniforms.uIter, state.iter);
          gl.uniform1f(uniforms.uDensity, state.bands * 0.02);
          gl.uniform1f(uniforms.uShift, state.shift);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        } else {
          drawCPU();
        }
        magLabel();
      }

      let anim = 0;
      function go(target, ms) {
        cancelAnimationFrame(anim);
        const from = { cx: state.cx, cy: state.cy, scale: state.scale };
        const t0 = performance.now();
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        function frame(now) {
          const t = reduced ? 1 : Math.min(1, (now - t0) / ms);
          const e = 1 - Math.pow(1 - t, 3);
          const logS = Math.log(from.scale) + (Math.log(target.scale) - Math.log(from.scale)) * e;
          state.cx = from.cx + (target.cx - from.cx) * e;
          state.cy = from.cy + (target.cy - from.cy) * e;
          state.scale = Math.exp(logS);
          draw();
          if (t < 1) anim = requestAnimationFrame(frame);
          else save();
        }
        anim = requestAnimationFrame(frame);
      }
      function zoomAt(sx, sy, factor) {
        const rect = canvas.getBoundingClientRect();
        const x = sx - rect.left;
        const y = sy - rect.top;
        const k = worldPerPx();
        const wx = state.cx + (x - rect.width / 2) * k;
        const wy = state.cy - (y - rect.height / 2) * k;
        const next = clampScale(state.scale * factor);
        const nk = (2 * next) / Math.max(1, rect.height);
        state.scale = next;
        state.cx = wx - (x - rect.width / 2) * nk;
        state.cy = wy + (y - rect.height / 2) * nk;
        state.preset = null;
        draw();
        save();
        syncControls();
      }
      function applyPreset(p) {
        state.iter = p.iter;
        state.bands = p.bands;
        state.preset = p.id;
        const scale = p.id === "overview" ? fitScale() : p.scale;
        syncControls();
        go({ cx: p.cx, cy: p.cy, scale }, 700);
      }

      for (const p of PRESETS) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = p.name;
        b.dataset.id = p.id;
        b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", () => applyPreset(p));
        presetsEl.appendChild(b);
      }
      dots.addEventListener("click", () => {
        const open = panel.hasAttribute("hidden");
        panel.toggleAttribute("hidden", !open);
        dots.setAttribute("aria-expanded", open ? "true" : "false");
        dots.setAttribute("aria-label", open ? "Close controls" : "Open controls");
      });
      iterEl.addEventListener("input", () => {
        state.iter = Number(iterEl.value);
        document.getElementById("iterOut").textContent = iterEl.value;
        draw(); save();
      });
      bandsEl.addEventListener("input", () => {
        state.bands = Number(bandsEl.value);
        document.getElementById("bandsOut").textContent = bandsEl.value;
        draw(); save();
      });
      shiftEl.addEventListener("input", () => {
        state.shift = Number(shiftEl.value) / 360;
        document.getElementById("shiftOut").textContent = shiftEl.value + "°";
        draw(); save();
      });
      document.getElementById("zin").addEventListener("click", () => zoomAt(innerWidth / 2, innerHeight / 2, 0.5));
      document.getElementById("zout").addEventListener("click", () => zoomAt(innerWidth / 2, innerHeight / 2, 2));
      document.getElementById("reset").addEventListener("click", () => applyPreset(PRESETS[0]));

      const installBtn = document.getElementById("install");
      const installed =
        matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      let installEvent = null;
      addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installEvent = event;
        if (!installed) installBtn.hidden = false;
      });
      installBtn.addEventListener("click", async () => {
        if (!installEvent) return;
        installEvent.prompt();
        await installEvent.userChoice;
        installEvent = null;
        installBtn.hidden = true;
      });
      addEventListener("appinstalled", () => {
        installBtn.hidden = true;
      });

      const ptr = new Map();
      let gesture = null;
      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (ptr.size === 1) gesture = { moved: false, x: e.clientX, y: e.clientY, shift: e.shiftKey, button: e.button };
        else if (ptr.size === 2) {
          const [a, b] = [...ptr.values()];
          gesture = { pinch: Math.hypot(a.x - b.x, a.y - b.y), moved: true };
        }
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!ptr.has(e.pointerId) || !gesture) return;
        const prev = ptr.get(e.pointerId);
        ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (ptr.size >= 2 && gesture.pinch) {
          const [a, b] = [...ptr.values()];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          const factor = gesture.pinch / Math.max(8, dist);
          gesture.pinch = dist;
          zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, factor);
          return;
        }
        const dx = e.clientX - prev.x;
        const dy = e.clientY - prev.y;
        if (Math.hypot(e.clientX - gesture.x, e.clientY - gesture.y) > 4) gesture.moved = true;
        if (!gesture.moved) return;
        const k = worldPerPx();
        state.cx -= dx * k;
        state.cy += dy * k;
        state.preset = null;
        draw();
      });
      function endPtr(e) {
        const g = gesture;
        ptr.delete(e.pointerId);
        if (ptr.size === 0) {
          gesture = null;
          if (g && !g.moved && !g.pinch) zoomAt(g.x, g.y, g.shift || g.button === 2 ? 2 : 0.5);
          else save();
          syncControls();
        }
      }
      canvas.addEventListener("pointerup", endPtr);
      canvas.addEventListener("pointercancel", endPtr);
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = Math.exp(Math.sign(e.deltaY) * 0.18);
        zoomAt(e.clientX, e.clientY, factor);
      }, { passive: false });
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") { panel.hidden = true; dots.setAttribute("aria-expanded", "false"); return; }
        if (e.key === "+" || e.key === "=") zoomAt(innerWidth / 2, innerHeight / 2, 0.5);
        else if (e.key === "-" || e.key === "_") zoomAt(innerWidth / 2, innerHeight / 2, 2);
        else if (e.key === "0") applyPreset(PRESETS[0]);
        else if (e.key.startsWith("Arrow")) {
          const k = worldPerPx() * 40;
          if (e.key === "ArrowLeft") state.cx -= k;
          if (e.key === "ArrowRight") state.cx += k;
          if (e.key === "ArrowUp") state.cy += k;
          if (e.key === "ArrowDown") state.cy -= k;
          state.preset = null;
          draw(); save(); syncControls();
        }
      });
      addEventListener("resize", draw);
      if (!state.preset) state.preset = null;
      syncControls();
      if (state.preset === "overview") state.scale = fitScale();
      draw();
    </script>
  </body>
</html>
